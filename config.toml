# Public application settings. Supply tokens and access keys through environment
# variables in production, or through an ignored .env file for local runs.

[app]
data_dir = "data"

[engine]
provider = "discord"

[logging]
filter = "info"

[storage]
provider = "s3"

[storage.s3]
bucket = "discord-voice-bot"
region = "auto"
endpoint = "https://2b57d1b377508b5749a5de4cbce789bf.r2.cloudflarestorage.com"
prefix = "recording"
force_path_style = true

[transcription]
url = "https://argmax.syntropika.ai/v1/audio/transcriptions"
model = "large-v3-v20240930_626MB"
language = "en"

# These are environment variable names, never secret values.
# Rename a variable here and in .env together if your deployment needs it.
[secrets]
discord_token_env = "DISCORD_TOKEN"                   # Required to run the bot.
transcription_api_key_env = "TRANSCRIPTION_API_KEY"    # Optional; enables transcription.
s3_access_key_id_env = "S3_ACCESS_KEY_ID"              # Required for S3 storage or --archive.
s3_secret_access_key_env = "S3_SECRET_ACCESS_KEY"      # Required for S3 storage or --archive.
s3_session_token_env = "S3_SESSION_TOKEN"              # Optional temporary S3 credentials.
