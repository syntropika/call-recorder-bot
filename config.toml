# Public application settings. Supply tokens and access keys through environment
# variables in production, or through an ignored .env file for local runs.

[app]
data_dir = "data"

[engine]
provider = "discord"

[engine.discord]
token = { env = "DISCORD_TOKEN" }

[logging]
filter = "info"

[storage]
provider = "s3"

[storage.s3]
bucket = { env = "S3_BUCKET" }
region = "auto"
# Use endpoint = { value = "https://..." } for a literal URL.
endpoint = { env = "S3_ENDPOINT" }
access_key_id = { env = "S3_ACCESS_KEY_ID" }
secret_access_key = { env = "S3_SECRET_ACCESS_KEY" }
session_token = { env = "S3_SESSION_TOKEN" }
prefix = "recording"
force_path_style = true

[transcription]
# Use url = { value = "https://..." } for a literal URL.
url = { env = "TRANSCRIPTION_URL" }
api_key = { env = "TRANSCRIPTION_API_KEY" }
model = "large-v3-v20240930_626MB"
language = "en"
