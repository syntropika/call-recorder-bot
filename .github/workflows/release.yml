name: Verify, publish, and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev pkg-config
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.94.0 fmt --check
      - name: Run tests
        run: cargo +1.94.0 test --locked
      - name: Run Clippy
        run: cargo +1.94.0 clippy --locked --all-targets -- -D warnings

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: vars.COOLIFY_APP_UUID != ''
    runs-on: ubuntu-latest
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      COOLIFY_WRITE_TOKEN: ${{ secrets.COOLIFY_WRITE_TOKEN }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${COOLIFY_URL:?Set the COOLIFY_URL repository variable}"
          : "${COOLIFY_APP_UUID:?Set the COOLIFY_APP_UUID repository variable}"
          : "${COOLIFY_WRITE_TOKEN:?Set the COOLIFY_WRITE_TOKEN secret}"
          : "${COOLIFY_DEPLOY_TOKEN:?Set the COOLIFY_DEPLOY_TOKEN secret}"
          : "${DISCORD_TOKEN:?Set the DISCORD_TOKEN secret}"
          : "${S3_ACCESS_KEY_ID:?Set the S3_ACCESS_KEY_ID secret}"
          : "${S3_SECRET_ACCESS_KEY:?Set the S3_SECRET_ACCESS_KEY secret}"
          [[ "$COOLIFY_URL" == https://* ]] || { echo 'COOLIFY_URL must use HTTPS' >&2; exit 1; }

      - name: Sync runtime secrets to Coolify
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg discord "$DISCORD_TOKEN" \
            --arg transcription "$TRANSCRIPTION_API_KEY" \
            --arg s3_key "$S3_ACCESS_KEY_ID" \
            --arg s3_secret "$S3_SECRET_ACCESS_KEY" \
            --arg s3_session "$S3_SESSION_TOKEN" \
            '{data: [
              {key: "DISCORD_TOKEN", value: $discord},
              {key: "TRANSCRIPTION_API_KEY", value: $transcription},
              {key: "S3_ACCESS_KEY_ID", value: $s3_key},
              {key: "S3_SECRET_ACCESS_KEY", value: $s3_secret},
              {key: "S3_SESSION_TOKEN", value: $s3_session}
            ] | map(. + {is_literal: true, is_shown_once: true, is_runtime: true, is_buildtime: false})}' |
            curl --fail --silent --show-error --output /dev/null \
              --request PATCH \
              --header "Authorization: Bearer $COOLIFY_WRITE_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              "${COOLIFY_URL%/}/api/v1/applications/$COOLIFY_APP_UUID/envs/bulk"

      - name: Select the published image
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg tag "$GITHUB_SHA" '{docker_registry_image_tag: $tag}' |
            curl --fail --silent --show-error --output /dev/null \
              --request PATCH \
              --header "Authorization: Bearer $COOLIFY_WRITE_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              "${COOLIFY_URL%/}/api/v1/applications/$COOLIFY_APP_UUID"

      - name: Deploy in Coolify
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=$COOLIFY_APP_UUID"
