name: Verify, publish, and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, docker]
    container: rust:1.94-bookworm
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: apt-get update && apt-get install -y cmake libopus-dev pkg-config
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.94.0 fmt --check
      - name: Run tests
        run: cargo +1.94.0 test --locked
      - name: Run Clippy
        run: cargo +1.94.0 clippy --locked --all-targets -- -D warnings

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 30
    steps:
      - name: Check Coolify configuration
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_PROJECT: ${{ secrets.COOLIFY_PROJECT }}
          COOLIFY_SERVER: ${{ secrets.COOLIFY_SERVER }}
        run: |
          test -n "$COOLIFY_URL" || { echo '::error::Set COOLIFY_URL in GitHub Actions secrets'; exit 1; }
          test -n "$COOLIFY_PROJECT" || { echo '::error::Set COOLIFY_PROJECT in GitHub Actions secrets'; exit 1; }
          test -n "$COOLIFY_SERVER" || { echo '::error::Set COOLIFY_SERVER in GitHub Actions secrets'; exit 1; }
      - name: Check COOLIFY_TOKEN
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          test -n "$COOLIFY_TOKEN" || { echo '::error::Set COOLIFY_TOKEN in GitHub Actions secrets'; exit 1; }
          echo 'COOLIFY_TOKEN is configured'
      - uses: actions/checkout@v4
      - name: Prepare Coolify domain
        env:
          MCP_PUBLIC_HOST: ${{ secrets.MCP_PUBLIC_HOST }}
        run: |
          if [[ ! "$MCP_PUBLIC_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo 'Set MCP_PUBLIC_HOST to a hostname without a scheme or path'
            exit 1
          fi
          umask 077
          printf '{"domains":"https://%s"}\n' "$MCP_PUBLIC_HOST" > "$RUNNER_TEMP/coolify-domain.json"
      - name: Configure and deploy in Coolify
        uses: syntropika/actions/coolify-deploy@e8ae2d4f7aaf70b546c6bf39908075a0c83da5e4 # v1.3.0
        env:
          COOLIFY_ENV_DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          COOLIFY_ENV_TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
          COOLIFY_ENV_TRANSCRIPTION_URL: ${{ secrets.TRANSCRIPTION_URL }}
          COOLIFY_ENV_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          COOLIFY_ENV_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          COOLIFY_ENV_S3_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}
          COOLIFY_ENV_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          COOLIFY_ENV_S3_BUCKET: ${{ secrets.S3_BUCKET }}
          COOLIFY_ENV_MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          COOLIFY_ENV_MCP_PUBLIC_HOST: ${{ secrets.MCP_PUBLIC_HOST }}
        with:
          url: ${{ secrets.COOLIFY_URL }}
          application-slug: call-recorder-bot
          project: ${{ secrets.COOLIFY_PROJECT }}
          server: ${{ secrets.COOLIFY_SERVER }}
          environment: production
          create-if-missing: 'true'
          application-file: deployment/coolify/application.json
          patch-file: ${{ runner.temp }}/coolify-domain.json
          required-env-keys: DISCORD_TOKEN,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,S3_ENDPOINT,S3_BUCKET,MCP_ACCESS_TOKEN,MCP_PUBLIC_HOST
          image-name: ghcr.io/${{ github.repository }}
          image-tag: ${{ github.sha }}
          read-token: ${{ secrets.COOLIFY_TOKEN }}
          write-token: ${{ secrets.COOLIFY_TOKEN }}
          deploy-token: ${{ secrets.COOLIFY_TOKEN }}
