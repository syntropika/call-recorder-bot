name: Verify, publish, and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev pkg-config
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.94.0 fmt --check
      - name: Run tests
        run: cargo +1.94.0 test --locked
      - name: Run Clippy
        run: cargo +1.94.0 clippy --locked --all-targets -- -D warnings

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: vars.COOLIFY_APP_UUID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare runtime environment
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          for (const name of ['DISCORD_TOKEN', 'S3_ACCESS_KEY_ID', 'S3_SECRET_ACCESS_KEY']) {
            if (!process.env[name]) throw new Error(`Set the ${name} GitHub Actions secret`);
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'coolify-env.json'), JSON.stringify({
            DISCORD_TOKEN: process.env.DISCORD_TOKEN,
            TRANSCRIPTION_API_KEY: process.env.TRANSCRIPTION_API_KEY || '',
            S3_ACCESS_KEY_ID: process.env.S3_ACCESS_KEY_ID,
            S3_SECRET_ACCESS_KEY: process.env.S3_SECRET_ACCESS_KEY,
            S3_SESSION_TOKEN: process.env.S3_SESSION_TOKEN || '',
          }), { mode: 0o600 });
          NODE

      - name: Configure and deploy in Coolify
        uses: syntropika/actions/coolify-deploy@04c3e7a3c3bd1576bd602bf3b1cabbdf9060f91a # v1.0.0
        with:
          url: ${{ vars.COOLIFY_URL }}
          uuids: ${{ vars.COOLIFY_APP_UUID }}
          resource-type: application
          env-file: ${{ runner.temp }}/coolify-env.json
          image-name: ghcr.io/${{ github.repository }}
          image-tag: ${{ github.sha }}
          read-token: ${{ secrets.COOLIFY_READ_TOKEN }}
          write-token: ${{ secrets.COOLIFY_WRITE_TOKEN }}
          deploy-token: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
