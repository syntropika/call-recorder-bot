name: Verify, publish, and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev pkg-config
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.94.0 fmt --check
      - name: Run tests
        run: cargo +1.94.0 test --locked
      - name: Run Clippy
        run: cargo +1.94.0 clippy --locked --all-targets -- -D warnings

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Coolify configuration
        id: coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL || vars.COOLIFY_URL }}
        run: |
          if [ -n "$COOLIFY_URL" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.coolify.outputs.configured == 'true'
      - name: Configure and deploy in Coolify
        if: steps.coolify.outputs.configured == 'true'
        uses: syntropika/actions/coolify-deploy@e8ae2d4f7aaf70b546c6bf39908075a0c83da5e4 # v1.3.0
        env:
          COOLIFY_ENV_DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          COOLIFY_ENV_TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
          COOLIFY_ENV_TRANSCRIPTION_URL: ${{ secrets.TRANSCRIPTION_URL || vars.TRANSCRIPTION_URL }}
          COOLIFY_ENV_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          COOLIFY_ENV_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          COOLIFY_ENV_S3_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}
          COOLIFY_ENV_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT || vars.S3_ENDPOINT }}
        with:
          url: ${{ secrets.COOLIFY_URL || vars.COOLIFY_URL }}
          application-slug: call-recorder-bot
          project: syntropika
          server: ovh1
          environment: production
          create-if-missing: 'true'
          application-file: deployment/coolify/application.json
          required-env-keys: DISCORD_TOKEN,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,S3_ENDPOINT
          image-name: ghcr.io/${{ github.repository }}
          image-tag: ${{ github.sha }}
          read-token: ${{ secrets.COOLIFY_READ_TOKEN }}
          write-token: ${{ secrets.COOLIFY_WRITE_TOKEN }}
          deploy-token: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
