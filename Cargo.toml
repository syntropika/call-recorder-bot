[package]
name = "call-recorder-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
dotenvy = "0.15"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend", "voice"] }
songbird = { version = "0.6.0", default-features = false, features = ["driver", "gateway", "receive", "rustls", "serenity", "tungstenite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs", "signal", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
aws-sdk-s3 = { version = "=1.137.0", default-features = false, features = ["rustls", "default-https-client", "http-1x", "rt-tokio"] }
toml = "1.1.6"
